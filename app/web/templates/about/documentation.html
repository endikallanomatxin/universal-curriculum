{{ define "documentation-index-pane" -}}
      <section class="ui-pane" aria-labelledby="documentation-title" data-nested-panel data-panel-motion="horizontal" data-layout-panel data-panel-modes="collapsed:0 mobile:20 standard:32" {{ if not .Page }}data-panel-fill{{ end }} data-panel-breadcrumb="Documentation" data-panel-preserve-scroll>
        <div class="ui-pane__inner about-index pane-breadcrumb" data-pane-content-width="narrow">
          <header class="about-index__header pane-breadcrumb__header">
            <div>
              <h1 id="documentation-title">Documentation</h1>
              <a class="pane-breadcrumb__title" href="/about/documentation" hx-get="/about/documentation" hx-target="#workspace" hx-select="#workspace" hx-swap="outerHTML" hx-push-url="true" data-panel-navigation="close">Documentation</a>
            </div>
            <a class="icon-button ui-pane__close" href="/about" hx-get="/about" hx-trigger="panel-close" hx-target="#workspace" hx-select="#workspace" hx-swap="outerHTML" hx-push-url="true" data-panel-navigation="close" aria-label="Close documentation">
              <span class="material-symbols-rounded" aria-hidden="true">close</span>
            </a>
          </header>
          <nav class="pane-navigation-list" aria-label="Documentation pages">
            {{ range .Pages }}
            <a class="pane-navigation-card pane-navigation-card--text-only selectable-surface" href="/about/documentation/{{ .Slug }}" hx-get="/about/documentation/{{ .Slug }}" hx-target="#workspace" hx-select="#workspace" hx-swap="outerHTML transition:true" hx-push-url="true" data-panel-navigation="open-or-replace">
              <span><strong>{{ .Title }}</strong><small>{{ .Summary }}</small></span>
            </a>
            {{ end }}
          </nav>
        </div>
      </section>
{{- end }}

{{ define "documentation-page-pane" -}}
      <section class="ui-pane" aria-labelledby="documentation-page-title" data-nested-panel data-panel-motion="horizontal" data-layout-panel data-panel-modes="collapsed:0 mobile:20 standard:42" data-panel-fill data-panel-breadcrumb="{{ .Page.Title }}">
        <article class="ui-pane__inner about-page" data-pane-content-width="reading">
          <header class="about-page__header">
            <h1 id="documentation-page-title">{{ .Page.Title }}</h1>
            <a class="icon-button ui-pane__close" href="/about/documentation" hx-get="/about/documentation" hx-trigger="panel-close" hx-target="#workspace" hx-select="#workspace" hx-swap="outerHTML" hx-push-url="true" data-panel-navigation="close" aria-label="Close {{ .Page.Title }}">
              <span class="material-symbols-rounded" aria-hidden="true">close</span>
            </a>
          </header>
          <div class="about-document">{{ .Rendered }}</div>
        </article>
      </section>
{{- end }}
