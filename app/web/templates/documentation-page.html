{{ define "documentation-page.html" -}}
<!doctype html>
<html lang="en">
<head>{{ template "document-head" .Title }}</head>
<body>
  <div class="app-shell" id="app-shell" data-panel-group>
    {{ template "primary-navigation" . }}
    <main class="pane-stack" id="workspace" data-shell-view="detail" data-document-title="{{ .Page.Title }} · Universal Curriculum" data-layout-panel data-panel-modes="mobile:20 content:34 wide:46" data-panel-required-mode="content" data-panel-fill data-panel-group>
      <nav class="mobile-panel-breadcrumbs" data-mobile-panel-breadcrumbs aria-label="Current location" hidden></nav>
      {{ template "about-index-pane" . }}
      {{ template "documentation-index-pane" . }}
      {{ template "documentation-page-pane" . }}
    </main>
  </div>
  {{ template "shell-scripts" }}
</body>
</html>
{{- end }}
