services:
  app:
    build:
      context: ./app/
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8080
      DB_HOST: db
      DB_USER: myusername
      DB_PASSWORD: mypassword
      DB_NAME: mydatabase
      DB_PORT: 5432
      DB_SSLMODE: disable
      STORAGE_BACKEND: local
      UPLOADS_FOLDER: /app/uploads
      BOOTSTRAP_ADMIN_EMAIL: admin@example.com
      BOOTSTRAP_ADMIN_PASSWORD: administrator
      BOOTSTRAP_ADMIN_FULL_NAME: Administrator
      BOOTSTRAP_ADMIN_ALIAS: admin
      ENV: dev
    volumes:
      - ./app:/app
      - uploads:/app/uploads

  migration-tests:
    build:
      context: ./app/
      dockerfile: Dockerfile.dev
    profiles:
      - test
    depends_on:
      db:
        condition: service_healthy
    environment:
      TEST_DATABASE_URL: postgres://myusername:mypassword@db:5432/mydatabase?sslmode=disable
    command:
      - go
      - test
      - ./internal/db/migrations
      - -run
      - TestMigrationsRoundTrip
      - -v
    volumes:
      - ./app:/app

  db:
    image: public.ecr.aws/docker/library/postgres:18
    environment:
      POSTGRES_USER: myusername
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydatabase
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myusername -d mydatabase"]
      interval: 1s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
  uploads:
